<!DOCTYPE html>
<html>
<head>
    <title>Color Flipper</title>
    <style>
        body {
            text-align: center;
            padding-top: 150px;
            font-family: Arial;
            background-color: #ffffff;
            transition: background-color 0.5s;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        #colorText {
            font-size: 20px;
            margin-bottom: 30px;
            color: #333;
        }

        #btn {
            padding: 15px 35px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: #333;
            color: white;
        }

        #btn:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <h1>Color Flipper 🎨</h1>
    <p id="colorText">current color: #ffffff</p>
    <button id="btn">flip color</button>

    <script>

        var btn = document.getElementById("btn");
        var colorText = document.getElementById("colorText");

        btn.onclick = function() {

            // this builds a random hex color like #a3f5c2
            var letters = "0123456789ABCDEF";
            var color = "#";

            for (var i = 0; i < 6; i++) {
                var randomNum = Math.floor(Math.random() * 16);
                color = color + letters[randomNum];
            }

            // slap the color on the background
            document.body.style.backgroundColor = color;

            // show the hex code on the screen
            colorText.innerHTML = "current color: " + color;

        };

    </script>

</body>
</html>
